<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AlpekaBOT · Sonando ahora</title>
<!-- Overlay para OBS (Fuente de navegador). Lo sirve AlpekaBOT en 127.0.0.1; los datos llegan por WebSocket.
     Los textos se pintan siempre con textContent: un título de YouTube nunca se interpreta como HTML. -->
<style>
@font-face { font-family: "Inter"; src: url(fonts/Inter-400.ttf); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-500.ttf); font-weight: 500; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-600.ttf); font-weight: 600; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-700.ttf); font-weight: 700; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono-400.ttf); font-weight: 400; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono-600.ttf); font-weight: 600; }

:root {
  --w: 460px; --font: "Inter"; --scale: 1;
  --accent: #9146ff; --accent-soft: rgba(145, 70, 255, .18); --border: rgba(145, 70, 255, .45);
  --bg: rgba(17, 19, 26, .85); --text: #fff; --sub: #a3a9bb;
  --radius: 14px; --cover: 84px; --cover-radius: 10px;
}
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
body { font-family: var(--font), "Inter", "Segoe UI", sans-serif; color: var(--text);
       font-size: calc(14px * var(--scale)); -webkit-font-smoothing: antialiased; }

#card { position: relative; box-sizing: border-box; width: var(--w); margin: 16px;
        padding: calc(14px * var(--scale)); display: flex; align-items: center; gap: calc(14px * var(--scale));
        border-radius: var(--radius); background: var(--bg); overflow: hidden;
        transition: opacity .45s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }
#card.border { box-shadow: inset 0 0 0 1px var(--border); }
#card.shadow { filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .45)); }
#card.anim-slide.hidden { opacity: 0; transform: translateX(-40px); }
#card.anim-fade.hidden { opacity: 0; }
#card.anim-none { transition: none; }
#card.anim-none.hidden { display: none; }

#blur { position: absolute; inset: -30px; background-size: cover; background-position: center;
        filter: blur(26px) saturate(1.5); opacity: .35; z-index: 0; display: none; }
#card.blur.has-cover #blur { display: block; }
#card > :not(#blur) { position: relative; z-index: 1; }

#cover { flex: none; width: var(--cover); height: var(--cover); border-radius: var(--cover-radius);
         object-fit: cover; background: var(--accent-soft); }
#cover-empty { flex: none; width: var(--cover); height: var(--cover); border-radius: var(--cover-radius);
               background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
#cover-empty svg { width: 42%; height: 42%; stroke: var(--accent); }

#info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(4px * var(--scale)); }
#header { display: flex; align-items: center; gap: 7px; color: var(--accent); font-weight: 700;
          font-size: .72em; letter-spacing: .12em; text-transform: uppercase; }
#bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 1em; }
#bars i { width: 3px; background: var(--accent); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
#bars i:nth-child(2) { animation-delay: -.4s; } #bars i:nth-child(3) { animation-delay: -.7s; }
@keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
body.paused #bars i { animation-play-state: paused; }

#title { font-weight: 700; font-size: 1.18em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#channel { color: var(--sub); font-size: .86em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#who { display: flex; align-items: center; gap: 8px; color: var(--sub); font-size: .82em; min-width: 0; }
#who-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#who b { color: var(--text); font-weight: 600; }
#platform { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 999px;
            font-size: .82em; font-weight: 600; }
#platform::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
#platform.twitch { color: #bf94ff; background: rgba(145, 70, 255, .2); }
#platform.kick { color: #53fc18; background: rgba(83, 252, 24, .14); }

#progress { display: flex; align-items: center; gap: 10px; margin-top: calc(4px * var(--scale)); }
#track { flex: 1; height: calc(4px * var(--scale)); border-radius: 99px; background: rgba(255, 255, 255, .14);
         overflow: hidden; }
#fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 1s linear; }
#time { flex: none; font-family: "JetBrains Mono", monospace; font-size: .74em; color: var(--sub); }
[hidden] { display: none !important; }
</style>
<style id="custom"></style>
</head>
<body>
<div id="card" class="hidden anim-slide">
  <div id="blur"></div>
  <img id="cover" alt="" hidden>
  <div id="cover-empty">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </div>
  <div id="info">
    <div id="header"><span id="bars"><i></i><i></i><i></i></span><span id="header-text"></span></div>
    <div id="title"></div>
    <div id="channel"></div>
    <div id="who"><span id="who-text"></span><span id="platform"></span></div>
    <div id="progress"><div id="track"><div id="fill"></div></div><span id="time"></span></div>
  </div>
</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get("t") || "";
  const PREVIEW = params.has("preview");
  const $ = (id) => document.getElementById(id);
  const card = $("card");
  let cfg = { flags: {}, animation: "slide", header_text: "Sonando ahora" };
  let state = { visible: false, paused: false, song: null };
  let prog = { pos: 0, dur: 0 };
  let songId = null;    // canción cuyos datos se muestran (para reiniciar el progreso)
  let shownId = null;   // canción visible en pantalla (para la animación al cambiar)
  let swapTimer = null;

  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${r}` : `${m}:${r}`;
  };

  function applyConfig() {
    for (const [k, v] of Object.entries(cfg.vars || {})) document.documentElement.style.setProperty(k, v);
    const f = cfg.flags || {};
    card.classList.toggle("border", !!f.border);
    card.classList.toggle("shadow", !!f.shadow);
    card.classList.toggle("blur", !!f.blur);
    for (const a of ["slide", "fade", "none"]) card.classList.toggle("anim-" + a, cfg.animation === a);
    $("custom").textContent = cfg.custom_css || "";
  }

  function fill() {
    const f = cfg.flags || {};
    const s = state.song;
    document.body.classList.toggle("paused", !!state.paused);
    $("header").hidden = !f.show_header;
    $("header-text").textContent = state.paused ? "En pausa" : (cfg.header_text || "");
    $("title").textContent = s ? s.title : "Nada sonando";
    $("channel").textContent = s ? s.channel : "";
    $("channel").hidden = !f.show_channel || !s || !s.channel;

    const cover = $("cover");
    const hasCover = !!(s && s.cover);
    if (hasCover && cover.dataset.src !== s.cover) {
      cover.dataset.src = s.cover;
      cover.src = s.cover;
      $("blur").style.backgroundImage = `url("${s.cover}")`;
    }
    cover.hidden = !f.show_cover || !hasCover;
    $("cover-empty").hidden = !f.show_cover || hasCover;
    card.classList.toggle("has-cover", hasCover && !!f.show_cover);

    const who = $("who-text");
    who.textContent = "";
    if (s && s.requester) {
      who.append("Pedida por ");
      const b = document.createElement("b");
      b.textContent = s.requester;
      who.append(b);
    } else if (s) {
      who.textContent = "Lista de respaldo";
    }
    who.hidden = !f.show_requester;
    const plat = $("platform");
    plat.className = s && s.platform ? s.platform : "";
    plat.textContent = s && s.platform ? (s.platform === "kick" ? "Kick" : "Twitch") : "";
    plat.hidden = !f.show_platform || !(s && s.platform);
    $("who").hidden = !s || (who.hidden && plat.hidden);

    $("progress").hidden = !s || (!f.show_progress && !f.show_time);
    $("track").hidden = !f.show_progress;
    $("time").hidden = !f.show_time;

    const id = s ? (s.id || s.title) : null;
    if (id !== songId) {
      songId = id;
      prog = { pos: 0, dur: s ? s.duration : 0 };
      renderProgress(true);
    }
  }

  function render() {
    const s = state.song;
    const id = s ? (s.id || s.title) : null;
    clearTimeout(swapTimer);
    if (state.visible && shownId !== null && id !== shownId && cfg.animation !== "none") {
      // Canción nueva con la tarjeta visible: sale con los datos viejos y entra con los nuevos
      card.classList.add("hidden");
      swapTimer = setTimeout(() => { fill(); card.classList.toggle("hidden", !state.visible); }, 420);
    } else {
      fill();
      card.classList.toggle("hidden", !state.visible);
    }
    shownId = state.visible ? id : null;
  }

  function renderProgress(instant) {
    const dur = prog.dur || (state.song ? state.song.duration : 0);
    const bar = $("fill");
    if (instant) bar.style.transition = "none";
    bar.style.width = (dur ? Math.min(100, (100 * prog.pos) / dur) : 0) + "%";
    if (instant) { void bar.offsetWidth; bar.style.transition = ""; }
    $("time").textContent = `${fmt(prog.pos)} / ${dur ? fmt(dur) : "--:--"}`;
  }

  function connect() {
    const url = `ws://${location.host}/overlay/ws?t=${encodeURIComponent(TOKEN)}${PREVIEW ? "&preview=1" : ""}`;
    let ws;
    try { ws = new WebSocket(url); } catch (e) { setTimeout(connect, 2000); return; }
    ws.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.type === "config") { cfg = m; applyConfig(); fill(); }
      else if (m.type === "state") { state = m; render(); }
      else if (m.type === "progress") { prog = m; renderProgress(false); }
    };
    ws.onclose = () => {           // la app se cerró o se desactivó el overlay: se oculta y reintenta
      state = { visible: false, paused: false, song: null };
      render();
      setTimeout(connect, 2000);
    };
  }
  connect();
})();
</script>
</body>
</html>
